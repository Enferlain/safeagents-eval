readme = "README.md"
requires-python = ">=3.14,<3.15"
license = "Apache-2.0 AND LicenseRef-Uber-Non-Commercial"
license-files = ["LICENSE", "NOTICE", "THIRD_PARTY_NOTICES.md", "licenses/**/*.txt"]
dependencies = [
  "atif-scan==0.8.23",
  "fastapi==0.133.1",
  "httpx==0.28.1",
  "Jinja2==3.1.6",
  "PyYAML==6.0.3",
  "safeagents @ git+https://github.com/huggingface/safeagents@2a178aacb74fe386667956d825fed49453823f70",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 120
